[package]
name = "dst-huiji-wiki"
version = "0.1.0"
edition = "2021"

[dependencies]
nom = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dst-anim-tool = { path = "../dst-anim-tool", default-features = false, features = ["gif"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
full_moon = { version = "2.2", features = ["lua52"] }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "cookies", "query", "form", "multipart"] }
dotenvy = "0.15"
zip = "8"
# 图片管线:PNG 解码/裁剪(split) + KTEX 容器解码(内置 ktech 等价实现) + atlas XML 布局解析
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.20"
# libsquish 的纯 Rust 移植(MIT):KTEX 的 DXT1/3/5 块解码
texpresso = "2"
toml = { version = "0.8", features = ["parse", "display"] }
similar = "3"
regex = "1"
rayon = "1"

# WebUI (axum server + job management)
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# OpenAI-compatible LLM client (SSE streaming); chat-completion pulls the REST
# client (`_api`), rustls stays the crate default TLS backend.
async-openai = { version = "0.41", features = ["chat-completion"] }
sha2 = "0.10"

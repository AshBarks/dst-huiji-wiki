[package]
name = "dst-anim-tool"
version = "0.1.0"
edition.workspace = true
description = "Don't Starve Together 动画资源（anim.bin/KTEX/atlas）解析、预览与 GIF 导出"
license = "MIT"
repository.workspace = true
readme = "README.md"

[features]
default = ["gui", "cli", "gif"]
# GUI 预览（eframe/egui/rfd）；GUI 内部使用 rayon 并行渲染，因此隐含启用 cli/parallel。
gui = ["dep:eframe", "dep:egui", "dep:rfd", "cli"]
# CLI 参数解析与 JSON 输出（clap/serde_json）。
cli = ["dep:clap", "dep:tracing-subscriber", "dep:serde", "dep:serde_json", "parallel"]
# 并行渲染（rayon）。纯库消费者可只开此特性获得 render_frame_with_elements_par。
parallel = ["dep:rayon"]
# GIF 导出（gif/which）。
gif = ["dep:gif", "dep:which"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
eframe = { version = "0.30", optional = true }
egui = { version = "0.30", optional = true }
gif = { version = "0.13", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", optional = true }
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
which = { version = "7", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
dst-ktex.workspace = true

[[bin]]
name = "dst-anim-tool"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]
